            type: integer
        - name: id
          in: query
          schema:
            format: int64
            type: integer
        - name: namedQuery
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            format: int32
            default: 0
            type: integer
        - name: score
          in: query
          schema:
            format: int32
            type: integer
        - name: size
          in: query
          schema:
            format: int32
            default: 20
            type: integer
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
        - name: userId
          in: query
          schema:
            format: int64
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExamAttempt"
    post:
      tags:
        - ExamAttempts
      summary: Tentativa
      requestBody:
        description: Simulado a ser criado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttemptExamDTO"
      responses:
        "200":
          description: A tentativa de simulado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    format: int64
                    type: integer
                  examId:
                    format: int64
                    type: integer
                  userId:
                    format: int64
                    type: integer
                  examVersion:
                    format: int32
                    type: integer
                  score:
                    format: int32
                    type: integer
                  answers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Answer"
                  active:
                    type: boolean
                  uuid:
                    $ref: "#/components/schemas/UUID"
                  createdAt:
                    $ref: "#/components/schemas/LocalDateTime"
                  updatedAt:
                    $ref: "#/components/schemas/LocalDateTime"
  /exam-attempts/count:
    get:
      tags:
        - ExamAttempts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                format: int64
                type: integer
