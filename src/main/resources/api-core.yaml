components:
  schemas:
    AddExamQuestion:
      type: object
      properties:
        questionsIds:
          type: array
          items:
            type: string
    Answer:
      type: object
      properties:
        questionId:
          format: int64
          type: integer
        alternativeId:
          format: byte
          type: string
    AttemptExamDTO:
      type: object
      properties:
        examId:
          format: int64
          type: integer
        userId:
          format: int64
          type: integer
        answers:
          type: array
          items:
            $ref: "#/components/schemas/Answer"
    Comment:
      type: object
      properties:
        content:
          type: string
        author:
          type: string
        authorId:
          type: string
        uuid:
          $ref: "#/components/schemas/UUID"
        active:
          type: boolean
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    CreateCommentDTO:
      type: object
      properties:
        content:
          type: string
        author:
          type: string
        authorId:
          type: string
    CreateDiscipline:
      type: object
      properties:
        name:
          type: string
    CreateExamDTO:
      required:
        - examType
        - name
        - disciplineId
        - topicId
      type: object
      properties:
        questionIds:
          type: array
          items:
            type: string
        author:
          type: string
        authorId:
          type: string
        examType:
          $ref: "#/components/schemas/ExamType"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          format: int32
          type: integer
        tags:
          type: array
          items:
            type: string
        disciplineId:
          format: int64
          type: integer
        topicId:
          format: int64
          type: integer
    CreatePet:
      type: object
      properties:
        name:
          type: string
    CreateQuestionAlternativeDTO:
      required:
        - content
      type: object
      properties:
        label:
          type: string
        content:
          type: string
        imageUrls:
          type: array
          items:
            type: string
    CreateQuestionDTO:
      required:
        - statement
        - difficulty
        - examType
        - disciplineId
        - topicId
        - questionAlternatives
        - correctAlternative
      type: object
      properties:
        statement:
          type: string
        explanation:
          type: string
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        examType:
          $ref: "#/components/schemas/ExamType"
        disciplineId:
          format: int64
          type: integer
        topicId:
          format: int64
          type: integer
        year:
          format: int32
          type: integer
        source:
          type: string
        sourceUrl:
          type: string
        authorId:
          type: string
        tags:
          type: array
          items:
            type: string
        questionAlternatives:
          type: array
          items:
            $ref: "#/components/schemas/CreateQuestionAlternativeDTO"
        correctAlternative:
          format: byte
          type: string
    CreateTopic:
      type: object
      properties:
        name:
          type: string
        disciplineId:
          format: int64
          type: integer
    Difficulty:
      enum:
        - EASY
        - MEDIUM
        - HARD
      type: string
    Discipline:
      type: object
      properties:
        id:
          format: int64
          type: integer
        name:
          type: string
        active:
          type: boolean
        uuid:
          $ref: "#/components/schemas/UUID"
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
          $ref: "#/components/schemas/LocalDateTime"
    Exam:
      type: object
      properties:
        id:
          format: int64
          type: integer
        questions:
          type: array
          items:
            $ref: "#/components/schemas/Question"
        author:
          type: string
        authorId:
          type: string
        examType:
          $ref: "#/components/schemas/ExamType"
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        name:
          type: string
        description:
          type: string
        imageUrl:
          type: string
        year:
          format: int32
          type: integer
        tags:
          type: array
          items:
            type: string
        discipline:
          $ref: "#/components/schemas/Discipline"
        topic:
          $ref: "#/components/schemas/Topic"
        version:
          format: int32
          type: integer
        active:
          type: boolean
        uuid:
          $ref: "#/components/schemas/UUID"
        createdAt:
          $ref: "#/components/schemas/LocalDateTime"
        updatedAt:
