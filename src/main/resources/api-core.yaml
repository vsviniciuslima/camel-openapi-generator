      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Question"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    delete:
      tags:
