---
openapi: 3.0.3
info:
  title: E-Simulados
  description: Plataforma de simulados
  termsOfService: Your terms here
  contact:
    name: Vinicius Santana
    url: https://vsviniciuslima.dev/contact
    email: vsviniciuslima@gmail.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.1
tags:
  - name: Disciplines
  - name: ExamAttempts
  - name: Exams
  - name: Pets
  - name: Questions
  - name: Topics
paths:
  /disciplines:
    get:
      tags:
        - Disciplines
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
        - name: id
          in: query
          schema:
            format: int64
            type: integer
        - name: name
          in: query
          schema:
            type: string
        - name: namedQuery
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            format: int32
            default: 0
            type: integer
        - name: size
          in: query
          schema:
            format: int32
            default: 20
            type: integer
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Discipline"
    post:
      tags:
        - Disciplines
      summary: Criar disciplina
      requestBody:
        description: Simulado a ser criado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDiscipline"
      responses:
        "200":
          description: Disciplina criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    format: int64
                    type: integer
                  name:
                    type: string
                  active:
                    type: boolean
                  uuid:
                    $ref: "#/components/schemas/UUID"
                  createdAt:
                    $ref: "#/components/schemas/LocalDateTime"
                  updatedAt:
                    $ref: "#/components/schemas/LocalDateTime"
  /disciplines/count:
    get:
      tags:
        - Disciplines
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                format: int64
                type: integer
  /disciplines/{id}:
    get:
      tags:
        - Disciplines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discipline"
    put:
      tags:
        - Disciplines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Discipline"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discipline"
    delete:
      tags:
        - Disciplines
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204": {}
  /errors/{id}:
    get:
      tags:
        - Pets
      summary: Consultar detalhes do erro
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Detalhes do erro
          content:
            application/json:
              schema:
                type: object
                properties:
                  reason:
                    type: string
                  details:
                    type: string
                  uuid:
                    type: string
  /exam-attempts:
    get:
      tags:
        - ExamAttempts
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
        - name: examId
          in: query
          schema:
            format: int64
            type: integer
        - name: examVersion
