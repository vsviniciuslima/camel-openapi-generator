      requestBody:
        description: Comentário
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentDTO"
      responses:
        "200":
          description: OK
  /questions/{id}/comments/{commentId}:
    delete:
      tags:
        - Questions
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/UUID"
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          description: OK
  /topics:
