          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExamAttempt"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExamAttempt"
    delete:
      tags:
        - ExamAttempts
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204": {}
  /exams:
    get:
      tags:
        - Exams
      parameters:
        - name: active
          in: query
          schema:
            type: boolean
        - name: author
          in: query
          schema:
            type: string
        - name: authorId
          in: query
          schema:
            type: string
        - name: description
          in: query
          schema:
            type: string
        - name: discipline.id
          in: query
          schema:
            format: int64
            type: integer
        - name: id
          in: query
          schema:
            format: int64
            type: integer
        - name: imageUrl
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: namedQuery
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            format: int32
            default: 0
            type: integer
        - name: size
          in: query
          schema:
            format: int32
            default: 20
            type: integer
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
        - name: topic.id
          in: query
          schema:
            format: int64
            type: integer
        - name: version
          in: query
          schema:
            format: int32
            type: integer
        - name: year
          in: query
          schema:
            format: int32
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
