                  $ref: "#/components/schemas/Exam"
    post:
      tags:
        - Exams
      summary: Criar simulado
      requestBody:
        description: Simulado a ser criado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExamDTO"
      responses:
        "200":
          description: Simulado criado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    format: int64
                    type: integer
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Question"
                  author:
                    type: string
                  authorId:
                    type: string
                  examType:
                    $ref: "#/components/schemas/ExamType"
                  difficulty:
                    $ref: "#/components/schemas/Difficulty"
                  name:
                    type: string
                  description:
                    type: string
                  imageUrl:
                    type: string
                  year:
                    format: int32
                    type: integer
                  tags:
                    type: array
                    items:
                      type: string
                  discipline:
                    $ref: "#/components/schemas/Discipline"
                  topic:
                    $ref: "#/components/schemas/Topic"
                  version:
                    format: int32
                    type: integer
                  active:
                    type: boolean
                  uuid:
                    $ref: "#/components/schemas/UUID"
                  createdAt:
                    $ref: "#/components/schemas/LocalDateTime"
                  updatedAt:
                    $ref: "#/components/schemas/LocalDateTime"
  /exams/count:
    get:
      tags:
        - Exams
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                format: int64
                type: integer
  /exams/{examId}/questions:
    post:
      tags:
        - Exams
      parameters:
        - name: examId
          in: path
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddExamQuestion"
      responses:
        "200":
          description: OK
  /exams/{id}:
    get:
      tags:
        - Exams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
    put:
      tags:
        - Exams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Exam"
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Exam"
    delete:
      tags:
        - Exams
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "204": {}
  /pets:
    post:
      tags:
        - Pets
      summary: Cadastrar pet
      parameters:
        - name: fail
          in: query
          schema:
            type: boolean
      requestBody:
        description: Simulado a ser criado
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePet"
      responses:
        "200":
          description: Pet cadastrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  id:
                    format: int64
                    type: integer
        "400":
          description: Erro no cadastro
          content:
            application/json:
              schema:
                type: object
                properties:
                  errorId:
                    type: string
  /questions:
    get:
      tags:
        - Questions
      parameters:
        - name: authorId
          in: query
          schema:
            type: string
        - name: correctAlternative
          in: query
          schema:
            format: byte
            type: string
        - name: discipline.id
          in: query
          schema:
            format: int64
            type: integer
        - name: explanation
          in: query
          schema:
            type: string
        - name: id
          in: query
          schema:
            format: int64
            type: integer
        - name: namedQuery
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            format: int32
            default: 0
            type: integer
        - name: size
          in: query
          schema:
            format: int32
            default: 20
            type: integer
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
        - name: source
          in: query
          schema:
            type: string
        - name: sourceUrl
          in: query
          schema:
            type: string
        - name: statement
          in: query
          schema:
            type: string
        - name: topic.id
          in: query
          schema:
            format: int64
            type: integer
        - name: year
          in: query
          schema:
            format: int32
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Question"
    post:
      tags:
        - Questions
      summary: Criar questão
      requestBody:
        description: Lista de presentes a serem criados
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuestionDTO"
      responses:
        "200":
          description: Questão criada
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    format: int64
                    type: integer
                  statement:
                    type: string
                  explanation:
                    type: string
                  difficulty:
                    $ref: "#/components/schemas/Difficulty"
                  examType:
                    $ref: "#/components/schemas/ExamType"
                  discipline:
                    $ref: "#/components/schemas/Discipline"
                  topic:
                    $ref: "#/components/schemas/Topic"
                  year:
                    format: int32
                    type: integer
                  source:
                    type: string
                  sourceUrl:
                    type: string
                  authorId:
                    type: string
                  tags:
                    type: array
                    items:
                      type: string
                  comments:
                    type: array
                    items:
                      $ref: "#/components/schemas/Comment"
                  alternatives:
                    type: array
                    items:
                      $ref: "#/components/schemas/QuestionAlternative"
                  correctAlternative:
                    format: byte
                    type: string
  /questions/count:
    get:
      tags:
        - Questions
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                format: int64
                type: integer
  /questions/{id}:
    get:
      tags:
        - Questions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            format: int64
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Question"
    put:
      tags:
